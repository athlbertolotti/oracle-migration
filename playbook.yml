- name: Migrazione Oracle Linux da VMware a Proxmox
  hosts: oracle_vms
  become: true
  vars_files:
    - vars.yml

  tasks:

    - name: Verifica sistema operativo
      ansible.builtin.debug:
        msg: "Sistema {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Raccogli servizi
      ansible.builtin.service_facts:

    - name: Fermare vmtoolsd se presente
      ansible.builtin.service:
        name: vmtoolsd
        state: stopped
      when: "'vmtoolsd.service' in services"

    - name: Disabilitare vmtoolsd se presente
      ansible.builtin.service:
        name: vmtoolsd
        enabled: false
      when: "'vmtoolsd.service' in services"

    - name: Rimuovere pacchetti VMware
      ansible.builtin.package:
        name: "{{ vmware_packages }}"
        state: absent

    - name: Installare qemu guest agent
      ansible.builtin.package:
        name: "{{ proxmox_packages }}"
        state: present

    - name: Abilitare qemu guest agent
      ansible.builtin.service:
        name: qemu-guest-agent
        state: started
        enabled: true

    - name: Caricare moduli virtio
      ansible.builtin.command: "modprobe {{ item }}"
      changed_when: false
      loop: "{{ virtio_modules }}"

    - name: Persistenza moduli virtio
      ansible.builtin.lineinfile:
        path: /etc/modules-load.d/virtio.conf
        line: "{{ item }}"
        create: true
      loop: "{{ virtio_modules }}"

    - name: Rigenerare initramfs Oracle/RHEL 8+
      ansible.builtin.command: dracut -f
      when: ansible_distribution_major_version | int >= 8

    - name: Rigenerare initramfs Oracle/RHEL 7
      ansible.builtin.command: >
        mkinitrd -f /boot/initramfs-{{ ansible_kernel }}.img {{ ansible_kernel }}
      when: ansible_distribution_major_version | int == 7

    - name: Riavviare VM
      ansible.builtin.reboot:
        msg: "Riavvio per completare la migrazione a Proxmox"
        reboot_timeout: 600
